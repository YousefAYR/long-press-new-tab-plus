<!DOCTYPE html>
<html dir="ltr" lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Long Press New Tab Plus Settings</title>
	<link rel="icon" href="img/icon32.png" sizes="32x32">
	<link rel="icon" href="img/icon128.png" sizes="128x128">
	<link href="css/options.css" rel="stylesheet">
	<script src="js/exceptions.js"></script>
	<script src="js/options.js"></script>
</head>
<body>
	<header class="topbar">
		<img src="img/icon128.png" class="logo" alt="" width="40" height="40">
		<div class="title">
			<h1>Long Press New Tab Plus</h1>
			<span class="version">Version <span id="version"></span></span>
		</div>
		<div class="switches">
			<label class="theme-switch">
				<span class="switch-label">Theme</span>
				<select id="theme" class="control"></select>
			</label>
			<button type="button" id="open-tab" class="button" hidden>Open Preferences in New Tab</button>
		</div>
	</header>
	<main id="app"></main>
</body>
</html>
