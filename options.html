<!DOCTYPE html>
<html dir="ltr">
<head>
    <meta charset="utf-8">
    <title>Options</title>
    <link href="css/options.css" rel="stylesheet">
    <script src="js/options.js"></script>
</head>
<body>
	<div style="text-align: center;margin: auto;border: solid 1px #ccc; border-radius: 6px; padding: 0 0 90px 0; width: 700px;">
		<h3>Long Press</h3>
		<div style="padding:15px 0 0 25px;text-align: center;">
			<div style="text-align: center;">
				<label style="font-size:13px;width:225px;display:inline-block">Left mouse button press</label>
				<select id="dragactionleft" class="selectclass actionselect">
				</select>
				<div style="margin-top: 8px;visibility: hidden;" id="web_service_lurl_container">
					<label style="font-size:13px;width:232px;display:inline-block"></label>
					<input type="text" id="web_service_lurl_input" placeholder="URL" class="web_service_url_input">
				</div>
			</div>
			<div style="text-align: center;visibility: hidden;">
				<label style="font-size:13px;width:225px;display:inline-block">Middle mouse button press</label>
				<select id="dragactionmiddle" class="selectclass actionselect">
				</select>
				<div style="margin-top: 8px;visibility: hidden;" id="web_service_murl_container">
					<label style="font-size:13px;width:232px;display:inline-block"></label>
					<input type="text" id="web_service_murl_input" placeholder="URL" class="web_service_url_input">
				</div>
			</div>
			<div style="text-align: center;">
				<label style="font-size:13px;width:225px;display:inline-block">Right mouse button press</label>
				<select id="dragactionright" class="selectclass actionselect">
				</select>
				<div style="margin-top: 8px;visibility: hidden;" id="web_service_rurl_container">
					<label style="font-size:13px;width:232px;display:inline-block"></label>
					<input type="text" id="web_service_rurl_input" placeholder="URL" class="web_service_url_input">
				</div>
			</div>
		</div>
		<div style="padding:35px 0 0 25px">
			<div style="text-align: center;">
				<label style="font-size:13px;">Long-press duration</label><br>
				<input type="range" min="100" max="3000" value="350" id="detectval" step="10"><br>
				<label id="detectvallbl">350</label> ms
			</div>
		</div>
		<div style="padding:35px 0 0 25px">
			<div style="text-align: center;">
				<label style="font-size:13px;">After closing a tab, switch to</label><br>
				<select id="closemode" class="selectclass" style="margin-top: 8px;">
					<option value="tree" selected>Tree order</option>
					<option value="next">Next tab</option>
					<option value="prev">Previously active tab</option>
					<option value="default">Firefox default</option>
				</select>
				<div id="closemodedesc" style="font-size:12px;color:#666;width:420px;margin:8px auto 0;line-height:1.5;"></div>
				<div id="selfparentcontainer" style="width:420px;margin:12px auto 0;font-size:13px;">
					<label><input type="checkbox" id="selfparent"> Treat tabs I open myself as children of the current tab</label>
					<div style="font-size:12px;color:#666;margin-top:4px;line-height:1.5;">New tabs, bookmarks and address-bar tabs are grouped under the tab you were on, so closing one returns there. Restored windows and tabs are left out.</div>
				</div>
			</div>
		</div>
	</div>
	<div style="text-align: center;margin: auto;border: solid 1px #ccc; border-radius: 6px; padding: 0 0 90px 0; width: 700px;margin-top:44px">
		<h3>Drag Link</h3>
		<label><input type="checkbox" id="enabledrag">Enabled</label>
		<div style="display:none" id="dragcontainer">
			<div style="padding:65px 0 0 25px">
				<div style="text-align: center;">
					<label style="font-size:13px;width:55px;display:inline-block">Up</label>
					<select id="ddragactionup" class="selectclass actionselect">
					</select>
					<div style="margin-top: 8px;visibility: hidden;" id="web_service_duurl_container">
						<label style="font-size:13px;width:90px;display:inline-block"></label>
						<input type="text" id="web_service_duurl_input" placeholder="URL" class="web_service_url_input">
					</div>
				</div>
				<div style="text-align: center;margin-top: 24px;">
					<label style="font-size:13px;width:55px;display:inline-block">Down</label>
					<select id="ddragactiondown" class="selectclass actionselect">
					</select>
					<div style="margin-top: 8px;visibility: hidden;" id="web_service_ddurl_container">
						<label style="font-size:13px;width:90px;display:inline-block"></label>
						<input type="text" id="web_service_ddurl_input" placeholder="URL" class="web_service_url_input">
					</div>
				</div>
				<div style="text-align: center;margin-top: 24px;">
					<label style="font-size:13px;width:55px;display:inline-block">Left</label>
					<select id="ddragactionleft" class="selectclass actionselect">
					</select>
					<div style="margin-top: 8px;visibility: hidden;" id="web_service_dlurl_container">
						<label style="font-size:13px;width:90px;display:inline-block"></label>
						<input type="text" id="web_service_dlurl_input" placeholder="URL" class="web_service_url_input">
					</div>
				</div>
				<div style="text-align: center;margin-top: 24px;">
					<label style="font-size:13px;width:55px;display:inline-block">Right</label>
					<select id="ddragactionright" class="selectclass actionselect">
					</select>
					<div style="margin-top: 8px;visibility: hidden;" id="web_service_drurl_container">
						<label style="font-size:13px;width:90px;display:inline-block"></label>
						<input type="text" id="web_service_drurl_input" placeholder="URL" class="web_service_url_input">
					</div>
				</div>
			</div>
			<div style="padding:35px 0 0 25px">
				<div style="text-align: center;">
					<label style="font-size:13px;">Detection Start</label><br>
					<input type="range" min="30" max="500" value="100" id="ddetectval" step="10"><br>
					<label id="ddetectvallbl">100</label> pixels
				</div>
			</div>
		</div>
	</div>
	<div style="margin: auto;border-radius: 6px; padding: 0 0 90px 0; width: 700px;margin-top:64px">
		<div style="padding:45px 0 0 25px">
			<div style="text-align: center;">
	            <div>Exceptions<img src="img/add.png" id="addbutton2"></div>
	            <div id="exceptpopupllist"></div>
			</div>
		</div>
	</div>
</body>
</html>
